syntax = "proto3";

package xingyistarry.mp.v1;

option csharp_namespace = "XingyiStarry.Mp.Protocol.Wire";
option go_package = "mprelay/internal/wire;wire";

enum Delivery {
  RELAY_CONTROL   = 0;
  TO_HOST         = 1;
  TO_CLIENT       = 2;
  BROADCAST       = 3;
}

message WireEnvelope {
  uint32 message_type     = 1;
  bytes  payload          = 2;
  optional bytes room_id          = 3;
  optional bytes client_id        = 4;
  optional bytes target_client_id = 5;
  Delivery delivery               = 6;
}

message GuidValue {
  bytes value = 1;
}

message Int64Value {
  int64 value = 1;
}

message StringValue {
  string value = 1;
}

message Hello {
  uint32 protocol_version    = 1;
  string plugin_version      = 2;
  string game_fingerprint    = 3;
  string content_fingerprint = 4;
  string display_name        = 5;
}

message Welcome {
  bytes          client_id       = 1;
  bytes          room_id         = 2;
  optional bytes match_id        = 3;
  int64          latest_frame_id = 4;
  WelcomeMode    mode            = 5;
}

enum WelcomeMode {
  WELCOME_LOBBY = 0;
  WELCOME_JOIN_SELECTION = 1;
  WELCOME_ACTIVE_MATCH = 2;
}

message Seat {
  bytes  seat_id          = 1;
  int32  lobby_slot_index = 2;
  int32  player_index     = 3;
  string display_name     = 4;

  bool           originally_human = 5;
  bool           connected        = 6;
  bool           ready            = 7;
  bool           ai_controlled    = 8;
  optional bytes client_id        = 9;

  int32 controller      = 10;
  int32 team            = 11;
  int32 color           = 12;
  int32 position        = 13;
  bool  position_random = 14;

  float  resource_multiplier = 15;
  float  ai_intelligence     = 16;
  string commander_id        = 17;
  int32  commander_mode      = 18;

  string          skill_id    = 19;
  repeated string passive_ids = 20;
  bool defeated = 21;
  bool pending_activation = 22;
}

message Room {
  bytes          room_id        = 1;
  optional bytes match_id       = 2;
  bool           match_started  = 3;
  int32          draft_revision = 4;

  string map_id        = 5;
  string map_title     = 6;
  int32  fow_type      = 7;
  int32  win_condition = 8;
  int32  quick_start   = 9;

  repeated Seat seats = 10;
  bool saved_game = 11;
  bool user_map = 12;
  bytes map_preview = 13;
}

message GameCommandMessage {
  uint32         kind     = 1;
  repeated int64 unit_ids = 2;
  sint32         target_x = 3;
  sint32         target_y = 4;

  repeated sint32 unit_target_xs  = 5;
  repeated sint32 unit_target_ys  = 6;
  int32           action_category = 7;

  string action_id            = 8;
  string template_id          = 9;
  int64  passenger_unit_id    = 10;
  bool   desired_toggle_state = 11;

  int32  debug_player_index = 12;
  sint32 debug_metal_delta  = 13;
  sint32 debug_power_delta  = 14;
  int32  ai_action_type     = 15;

}

message CommandRequestMessage {
  reserved 1;
  reserved "client_id";
  uint64             request_id       = 2;
  bytes              seat_id          = 3;
  int32              round            = 4;
  int64              applied_frame_id = 5;
  GameCommandMessage command          = 6;
}

enum RelayRoomStatus {
  RELAY_ROOM_WAITING = 0;
  RELAY_ROOM_CLOSED  = 1;
  RELAY_ROOM_PLAYING = 2;
}

message RelayRoomInfo {
  bytes room_id = 1;
  string room_name = 2;
  string host_name = 3;
  string map_title = 4;
  int32 connected_players = 5;
  int32 human_seats = 6;
  bool has_password = 7;
  RelayRoomStatus status = 8;
  string plugin_version = 9;
  string game_fingerprint = 10;
  string content_fingerprint = 11;
  int32 available_seats = 12;
}

message RelayRegisterRoomRequest {
  uint64 request_id = 1;
  bytes room_id = 2;
  string room_name = 3;
  string host_name = 4;
  string password = 5;
  string plugin_version = 6;
  string game_fingerprint = 7;
  string content_fingerprint = 8;
}

message RelayUpdateRoomRequest {
  uint64 request_id = 1;
  bytes room_id = 2;
  string map_title = 3;
  int32 connected_players = 4;
  int32 human_seats = 5;
  RelayRoomStatus status = 6;
  int32 available_seats = 7;
  optional bytes match_id = 8;
}

message RelayListRoomsRequest {
  uint64 request_id = 1;
}

message RelayListRoomsResponse {
  uint64 request_id = 1;
  repeated RelayRoomInfo rooms = 2;
}

message RelayJoinRoomRequest {
  uint64 request_id = 1;
  bytes room_id = 2;
  string password = 3;
}

message RelayResumeRoomRequest {
  uint64 request_id = 1;
  bytes room_id = 2;
  bytes client_id = 3;
  bytes match_id = 4;
}

message RelayControlResponse {
  uint64 request_id = 1;
  bool success = 2;
  string reason = 3;
  optional bytes client_id = 4;
}

message RelayRoomRequest {
  uint64 request_id = 1;
  bytes room_id = 2;
}

message RelayPeerNotice {
  bytes client_id = 1;
  string reason = 2;
}

message JoinMatchRequest {
  bytes seat_id = 1;
}

message ResumeSessionRequest {
  bytes room_id = 1;
  bytes match_id = 2;
  bytes client_id = 3;
  int64 applied_frame_id = 4;
  int64 verified_frame_id = 5;
}

message ResumeSessionAccepted {
  bytes room_id = 1;
  bytes match_id = 2;
  bytes client_id = 3;
  int64 latest_frame_id = 4;
}

message SeatControlChanged {
  bytes seat_id = 1;
  int32 player_index = 2;
  bool ai_controlled = 3;
  string reason = 4;
}

message CommandResponseMessage {
  uint64 request_id         = 1;
  int64  authority_frame_id = 2;
  string reason             = 3;
}

message RandomRecordMessage {
  string call_site      = 1;
  int32  ordinal        = 2;
  uint32 value_kind     = 3;
  int64  integer_value  = 4;
  double floating_value = 5;
}

message Resolution {
  bytes                        operation_id       = 1;
  int32                        stage_id           = 2;
  int32                        settlement_ordinal = 3;
  repeated RandomRecordMessage random_records     = 4;
}

message OperationBegin {
  bytes              operation_id = 1;
  bytes              seat_id      = 2;
  uint64             request_id   = 3;
  int32              round        = 4;
  GameCommandMessage command      = 5;
}

message OperationEnd {
  bytes operation_id = 1;
}

message OperationFailed {
  bytes  operation_id = 1;
  string reason       = 2;
}

message AuthorityFrameMessage {
  bytes  match_id      = 1;
  int64  frame_id      = 2;
  bytes  previous_hash = 3;
  uint32 frame_type    = 4;
  bytes  payload       = 5;
  bytes  hash          = 6;
}

message AuthorityHashInput {
  string domain        = 1;
  bytes  match_id      = 2;
  int64  frame_id      = 3;
  bytes  previous_hash = 4;
  uint32 frame_type    = 5;
  bytes  payload       = 6;
}

message SnapshotManifestMessage {
  bytes snapshot_id       = 1;
  bytes match_id          = 2;
  int64 frame_id          = 3;
  bytes frame_hash        = 4;
  int32 compressed_length = 5;
  int32 chunk_count       = 6;
  bytes content_hash      = 7;
}

message SnapshotChunkMessage {
  bytes snapshot_id = 1;
  int32 index       = 2;
  bytes data        = 3;
}
