syntax = "proto3";

package xingyistarry.mp.v1;

option csharp_namespace = "XingyiStarry.Mp.Protocol.Wire";
option go_package = "mprelay/internal/wire;wire";

enum Delivery {
  RELAY_CONTROL   = 0;
  TO_HOST         = 1;
  TO_CLIENT       = 2;
  BROADCAST       = 3;
}

message WireEnvelope {
  uint32 message_type = 1 [deprecated = true];
  bytes payload = 2 [deprecated = true];
  optional bytes room_id          = 3;
  optional bytes client_id        = 4;
  optional bytes target_client_id = 5;
  Delivery delivery               = 6;
  oneof body {
    Hello hello = 101;
    Welcome welcome = 102;
    StringValue reject = 103;
    Int64Value heartbeat = 104;
    Room room_state = 105;
    Int64Value claim_seat = 106;
    Int64Value set_ready = 107;
    GuidValue start_match = 108;
    CommandRequestMessage command_request = 109;
    CommandResponseMessage command_accepted = 110;
    CommandResponseMessage command_rejected = 111;
    AuthorityFrameMessage authority_frame = 112;
    Int64Value history_request = 113;
    Int64Value history_complete = 114;
    Int64Value snapshot_request = 115;
    SnapshotManifestMessage snapshot_manifest = 116;
    SnapshotChunkMessage snapshot_chunk = 117;
    GuidValue snapshot_complete = 118;
    GuidValue catch_up_complete = 119;
    StringValue session_ended = 120;
    Room lobby_draft_change = 121;
    StringValue participant_notice = 122;
    RelayRegisterRoomRequest relay_register_room = 123;
    RelayUpdateRoomRequest relay_update_room = 124;
    RelayListRoomsRequest relay_list_rooms = 125;
    RelayListRoomsResponse relay_room_list = 126;
    RelayJoinRoomRequest relay_join_room = 127;
    RelayControlResponse relay_control_response = 128;
    RelayRoomRequest relay_close_joining = 129;
    RelayRoomRequest relay_leave_room = 130;
    RelayRoomRequest relay_close_room = 131;
    RelayPeerNotice relay_peer_joined = 132;
    RelayPeerNotice relay_peer_left = 133;
    GuidValue release_seat = 134;
    JoinMatchRequest join_match_request = 135;
    JoinMatchAcceptedMessage join_match_accepted = 136;
    ResumeSessionRequest resume_session = 137;
    ResumeSessionAccepted resume_session_accepted = 138;
    StringValue resume_session_rejected = 139;
    GuidValue leave_session = 140;
    RelayResumeRoomRequest relay_resume_room = 141;
    GuidValue match_starting = 142;
    ChatSendMessage chat_send = 143;
    ChatEventMessage chat_event = 144;
    PingSendMessage ping_send = 145;
    PingEventMessage ping_event = 146;
    SocialSyncRequestMessage social_sync_request = 147;
    SocialSyncBeginMessage social_sync_begin = 148;
    SocialSyncChunkMessage social_sync_chunk = 149;
    SocialSyncCompleteMessage social_sync_complete = 150;
    RelayPeerNotice relay_room_closed = 151;
  }
}

message GuidValue {
  bytes value = 1;
}

message Int64Value {
  int64 value = 1;
}

message StringValue {
  string value = 1;
}

message Hello {
  uint32 protocol_version    = 1;
  string plugin_version      = 2;
  string game_fingerprint    = 3;
  string content_fingerprint = 4;
  string display_name        = 5;
  string password            = 6;
}

message Welcome {
  bytes          client_id       = 1;
  bytes          room_id         = 2;
  optional bytes match_id        = 3;
  int64          latest_frame_id = 4;
  WelcomeMode    mode            = 5;
}

enum WelcomeMode {
  WELCOME_LOBBY = 0;
  WELCOME_JOIN_SELECTION = 1;
  WELCOME_ACTIVE_MATCH = 2;
}

enum ParticipantAdmission {
  PARTICIPANT_LOBBY          = 0;
  PARTICIPANT_JOIN_SELECTION = 1;
  PARTICIPANT_PLAYER         = 2;
  PARTICIPANT_SPECTATOR      = 3;
}

message Participant {
  bytes client_id = 1;
  string display_name = 2;
  bool ready = 3;
  bool connected = 4;
  bool reconnecting = 5;
  bool is_host = 6;
  ParticipantAdmission admission = 7;
  optional bytes seat_id = 8;
}

message Seat {
  bytes  seat_id          = 1;
  int32  lobby_slot_index = 2;
  int32  player_index     = 3;
  string display_name     = 4;

  bool           originally_human = 5;
  bool           connected        = 6;
  bool           ready            = 7;
  bool           ai_controlled    = 8;
  optional bytes client_id        = 9;

  int32 controller      = 10;
  int32 team            = 11;
  int32 color           = 12;
  int32 position        = 13;
  bool  position_random = 14;

  float  resource_multiplier = 15;
  float  ai_intelligence     = 16;
  string commander_id        = 17;
  int32  commander_mode      = 18;

  string          skill_id    = 19;
  repeated string passive_ids = 20;
  bool defeated = 21;
  bool pending_activation = 22;
  bool keep_map_commander = 23;
}

message Room {
  bytes          room_id        = 1;
  optional bytes match_id       = 2;
  bool           match_started  = 3;
  int32          draft_revision = 4;

  string map_id        = 5;
  string map_title     = 6;
  int32  fow_type      = 7;
  int32  win_condition = 8;
  int32  quick_start   = 9;

  repeated Seat seats = 10;
  bool saved_game = 11;
  bool user_map = 12;
  bytes map_preview = 13;
  int32 difficulty = 14;
  int32 max_participants = 15;
  repeated Participant participants = 16;
  uint32 participant_revision = 17;
}

message GameCommandMessage {
  uint32         kind     = 1 [deprecated = true];
  repeated int64 unit_ids = 2 [deprecated = true];
  sint32         target_x = 3 [deprecated = true];
  sint32         target_y = 4 [deprecated = true];

  repeated sint32 unit_target_xs  = 5 [deprecated = true];
  repeated sint32 unit_target_ys  = 6 [deprecated = true];
  int32           action_category = 7 [deprecated = true];

  string action_id            = 8 [deprecated = true];
  string template_id          = 9 [deprecated = true];
  int64  passenger_unit_id    = 10 [deprecated = true];
  bool   desired_toggle_state = 11 [deprecated = true];

  int32  debug_player_index = 12 [deprecated = true];
  sint32 debug_metal_delta  = 13 [deprecated = true];
  sint32 debug_power_delta  = 14 [deprecated = true];
  int32  ai_action_type     = 15 [deprecated = true];
  repeated ResolvedUnitAction resolved_actions = 16 [deprecated = true];
  oneof body {
    MoveCommand move = 101;
    ActionCommand action = 102;
    EquipmentActionCommand equipment_action = 103;
    EquipmentMoveActionCommand equipment_move_action = 104;
    BuildWithMoveCommand build_with_move = 105;
    SkillCommand skill = 106;
    UndoMoveCommand undo_move = 107;
    EndTurnCommand end_turn = 108;
    AutoGuideStartCommand auto_guide_start = 109 [deprecated = true];
    DebugAddResourcesCommand debug_add_resources = 111;
    DebugFillSkillCommand debug_fill_skill = 112;
    AiUnitActionCommand ai_unit_action = 113;
    AiSkillCommand ai_skill = 114;
    TurnAdvanceCommand turn_advance = 115;
    SurrenderCommand surrender = 116;
    ToggleStandbyCommand toggle_standby = 117;
    ToggleSleepCommand toggle_sleep = 118;
    StayCommand stay = 119 [deprecated = true];
    SelfDestructCommand self_destruct = 120;
    ResolvedUnitActionsCommand resolved_unit_actions = 121;
  }
}

// Host-resolved native auto-guide batch. Clients execute these actions without planning.
message ResolvedUnitAction {
  int64 unit_id = 1;
  int32 action_type = 2 [deprecated = true];
  sint32 move_x = 3 [deprecated = true];
  sint32 move_y = 4 [deprecated = true];
  sint32 target_x = 5 [deprecated = true];
  sint32 target_y = 6 [deprecated = true];
  int32 action_category = 7 [deprecated = true];
  string template_id = 8 [deprecated = true];
  int64 passenger_unit_id = 9 [deprecated = true];
  bool skip_animations = 10;
  oneof body {
    ResolvedMove move = 100;
    ResolvedAction action = 101;
    ResolvedCreate create = 102;
    ResolvedUnload unload = 103;
  }
}

message CommandRequestMessage {
  reserved 1;
  reserved "client_id";
  uint64             request_id       = 2;
  bytes              seat_id          = 3;
  int32              round            = 4;
  int64              applied_frame_id = 5;
  GameCommandMessage command          = 6;
}

enum RelayRoomStatus {
  RELAY_ROOM_WAITING = 0;
  RELAY_ROOM_CLOSED  = 1;
  RELAY_ROOM_PLAYING = 2;
}

message RelayRoomInfo {
  bytes room_id = 1;
  string room_name = 2;
  string host_name = 3;
  string map_title = 4;
  int32 connected_players = 5;
  int32 human_seats = 6;
  bool has_password = 7;
  RelayRoomStatus status = 8;
  string plugin_version = 9;
  string game_fingerprint = 10;
  string content_fingerprint = 11;
  int32 available_seats = 12;
  int32 max_participants = 13;
}

message RelayRegisterRoomRequest {
  uint64 request_id = 1;
  bytes room_id = 2;
  string room_name = 3;
  string host_name = 4;
  string password = 5;
  string plugin_version = 6;
  string game_fingerprint = 7;
  string content_fingerprint = 8;
  int32 max_participants = 9;
}

message RelayUpdateRoomRequest {
  uint64 request_id = 1;
  bytes room_id = 2;
  string map_title = 3;
  int32 connected_players = 4;
  int32 human_seats = 5;
  RelayRoomStatus status = 6;
  int32 available_seats = 7;
  optional bytes match_id = 8;
  int32 max_participants = 9;
}

message RelayListRoomsRequest {
  uint64 request_id = 1;
}

message RelayListRoomsResponse {
  uint64 request_id = 1;
  repeated RelayRoomInfo rooms = 2;
}

message RelayJoinRoomRequest {
  uint64 request_id = 1;
  bytes room_id = 2;
  string password = 3;
}

message RelayResumeRoomRequest {
  uint64 request_id = 1;
  bytes room_id = 2;
  bytes client_id = 3;
  bytes match_id = 4;
}

message RelayControlResponse {
  uint64 request_id = 1;
  bool success = 2;
  string reason = 3;
  optional bytes client_id = 4;
}

message RelayRoomRequest {
  uint64 request_id = 1;
  bytes room_id = 2;
}

message RelayPeerNotice {
  bytes client_id = 1;
  string reason = 2;
}

message JoinMatchRequest {
  optional bytes seat_id = 1;
}

message JoinMatchAcceptedMessage {
  optional bytes seat_id = 1;
  bool spectator = 2;
}

enum ChatChannel {
  CHAT_PUBLIC = 0;
  CHAT_TEAM = 1;
}

enum ChatKind {
  CHAT_PLAYER = 0;
  CHAT_SYSTEM = 1;
}

enum SystemEventKind {
  SYSTEM_NONE = 0;
  SYSTEM_JOINED = 1;
  SYSTEM_LEFT = 2;
  SYSTEM_DISCONNECTED = 3;
  SYSTEM_RECONNECTED = 4;
  SYSTEM_AI_TAKEOVER = 5;
  SYSTEM_ENTERED_PLAYER = 6;
  SYSTEM_ENTERED_SPECTATOR = 7;
}

message ChatSendMessage {
  ChatChannel channel = 1;
  string text = 2;
}

message ChatEventMessage {
  uint64 social_seq = 1;
  int64 server_ticks = 2;
  ChatChannel channel = 3;
  ChatKind kind = 4;
  SystemEventKind system_kind = 5;
  optional bytes sender_client_id = 6;
  string sender_name = 7;
  int32 sender_team = 8;
  int32 sender_color = 9;
  bool sender_is_spectator = 10;
  string text = 11;
}

message PingSendMessage {
  sint32 tile_x = 1;
  sint32 tile_y = 2;
}

message PingEventMessage {
  bytes sender_client_id = 1;
  string sender_name = 2;
  int32 sender_team = 3;
  int32 sender_color = 4;
  sint32 tile_x = 5;
  sint32 tile_y = 6;
  int32 remaining_ttl_millis = 7;
}

message SocialSyncRequestMessage {
  uint64 request_id = 1;
}

message SocialSyncBeginMessage {
  uint64 request_id = 1;
  uint64 watermark = 2;
  uint32 chunk_count = 3;
  repeated Participant participants = 4;
}

message SocialSyncChunkMessage {
  uint64 request_id = 1;
  uint32 chunk_index = 2;
  repeated ChatEventMessage messages = 3;
}

message SocialSyncCompleteMessage {
  uint64 request_id = 1;
  uint64 watermark = 2;
}

message ResumeSessionRequest {
  bytes room_id = 1;
  bytes match_id = 2;
  bytes client_id = 3;
  int64 applied_frame_id = 4;
  int64 verified_frame_id = 5;
}

message ResumeSessionAccepted {
  bytes room_id = 1;
  bytes match_id = 2;
  bytes client_id = 3;
  int64 latest_frame_id = 4;
}

message SeatControlChanged {
  bytes seat_id = 1;
  int32 player_index = 2;
  bool ai_controlled = 3;
  string reason = 4;
}

message CommandResponseMessage {
  uint64 request_id         = 1;
  int64  authority_frame_id = 2;
  string reason             = 3;
}

message RandomRecordMessage {
  string call_site = 1;
  int32 ordinal = 2;
  uint32 value_kind     = 3 [deprecated = true];
  int64  integer_value  = 4 [deprecated = true];
  double floating_value = 5 [deprecated = true];
  oneof value {
    int64 integer = 6;
    double floating = 7;
  }
}

message Resolution {
  bytes                        operation_id = 1;
  int32                        stage_id           = 2 [deprecated = true];
  int32                        settlement_ordinal = 3 [deprecated = true];
  repeated RandomRecordMessage random_records     = 4 [deprecated = true];
  AttackSettlement             attack_settlement  = 5 [deprecated = true];
  SettlementEvent event = 100;
}

// Runtime events, not predicted damage. Native animations do not authorize settlement.
message AttackSettlement {
  option deprecated = true;
  enum Kind {
    UNSPECIFIED = 0;
    BATCH_STARTED = 1;
    CELL = 2;
    DEATH = 3;
    BATCH_ENDED = 4;
  }
  Kind   kind            = 1;
  int32  batch_id        = 2;
  int64  unit_id         = 3;
  string action_name     = 4;
  sint32 target_x        = 5;
  sint32 target_y        = 6;
  sint32 origin_x        = 7;
  sint32 origin_y        = 8;
  float  data            = 9;
}

message OperationBegin {
  bytes              operation_id = 1;
  bytes              seat_id      = 2;
  uint64             request_id   = 3;
  int32              round        = 4;
  GameCommandMessage command      = 5;
  bool               live_settlements = 6 [deprecated = true];
}

message OperationEnd {
  bytes operation_id = 1;
}

message OperationFailed {
  bytes  operation_id = 1;
  string reason       = 2;
}

message AuthorityFrameMessage {
  bytes  match_id      = 1;
  int64  frame_id      = 2;
  bytes  previous_hash = 3;
  uint32 frame_type = 4 [deprecated = true];
  bytes payload = 5 [deprecated = true];
  bytes  hash          = 6;
  oneof body {
    OperationBegin operation_begin = 101;
    Resolution resolution = 102;
    OperationEnd operation_end = 103;
    AuthorityTurnPhase turn_phase = 104;
    SeatControlChanged seat_changed = 105;
    AuthorityMatchEnded match_ended = 106;
    OperationFailed operation_failed = 107;
  }
}

message AuthorityHashInput {
  option deprecated = true;
  string domain        = 1;
  bytes  match_id      = 2;
  int64  frame_id      = 3;
  bytes  previous_hash = 4;
  uint32 frame_type    = 5;
  bytes  payload       = 6;
}

message SnapshotManifestMessage {
  bytes snapshot_id       = 1;
  bytes match_id          = 2;
  int64 frame_id          = 3;
  bytes frame_hash        = 4;
  int32 compressed_length = 5;
  int32 chunk_count       = 6;
  bytes content_hash      = 7;
}

message SnapshotChunkMessage {
  bytes snapshot_id = 1;
  int32 index       = 2;
  bytes data        = 3;
}

message MoveCommand {
  repeated int64 unit_ids = 2;
  sint32 target_x = 3 [deprecated = true];
  sint32 target_y = 4 [deprecated = true];
  repeated sint32 unit_target_xs = 5;
  repeated sint32 unit_target_ys = 6;
  bool desired_toggle_state = 11 [deprecated = true];
}

message ActionCommand {
  repeated int64 unit_ids = 2;
  sint32 target_x = 3;
  sint32 target_y = 4;
  repeated sint32 unit_target_xs = 5;
  repeated sint32 unit_target_ys = 6;
  int32 action_category = 7;
  string template_id = 9;
  int64 passenger_unit_id = 10;
  bool desired_toggle_state = 11;
}

message EquipmentActionCommand {
  repeated int64 unit_ids = 2;
  sint32 target_x = 3;
  sint32 target_y = 4;
  int32 action_category = 7;
  string action_id = 8;
  string template_id = 9;
}

message EquipmentMoveActionCommand {
  repeated int64 unit_ids = 2;
  sint32 target_x = 3;
  sint32 target_y = 4;
  int32 action_category = 7;
  string action_id = 8;
  string template_id = 9;
  ActionMovePosition move_position = 100;
}

message BuildWithMoveCommand {
  repeated int64 unit_ids = 2;
  sint32 target_x = 3;
  sint32 target_y = 4;
  int32 action_category = 7;
  string template_id = 9;
  ActionMovePosition move_position = 100;
}

message SkillCommand {
  sint32 target_x = 3;
  sint32 target_y = 4;
}

message UndoMoveCommand {
}

message EndTurnCommand {
}

message AutoGuideStartCommand {
  repeated int64 unit_ids = 2;
}

message DebugAddResourcesCommand {
  int32 debug_player_index = 12;
  sint32 debug_metal_delta = 13;
  sint32 debug_power_delta = 14;
}

message DebugFillSkillCommand {
  int32 debug_player_index = 12;
}

message AiUnitActionCommand {
  repeated int64 unit_ids = 2;
  sint32 target_x = 3;
  sint32 target_y = 4;
  repeated sint32 unit_target_xs = 5;
  repeated sint32 unit_target_ys = 6;
  int32 action_category = 7;
  string template_id = 9;
  int64 passenger_unit_id = 10;
  bool desired_toggle_state = 11;
  int32 ai_action_type = 15;
}

message AiSkillCommand {
  sint32 target_x = 3;
  sint32 target_y = 4;
  bool desired_toggle_state = 11;
}

message TurnAdvanceCommand {
}

message SurrenderCommand {
  sint32 target_x = 3;
}

message ToggleStandbyCommand {
  repeated int64 unit_ids = 2;
  bool desired_toggle_state = 11;
}

message ToggleSleepCommand {
  repeated int64 unit_ids = 2;
  bool desired_toggle_state = 11;
}

message StayCommand {
  repeated int64 unit_ids = 2;
}

message SelfDestructCommand {
  repeated int64 unit_ids = 2;
}

message ResolvedUnitActionsCommand {
  repeated int64 unit_ids = 2;
  repeated ResolvedUnitAction resolved_actions = 16;
}

message RandomRecordList { repeated RandomRecordMessage records = 1; }
message UnitRandomResult { int64 unit_id = 1; RandomRecordList values = 2; }
message TileRandomResult { sint32 x = 1; sint32 y = 2; RandomRecordList values = 3; }
message RandomResult {
  RandomRecordMessage damage_roll = 1;
  RandomRecordMessage damage_variation = 2;
  RandomRecordMessage death_wreck_scale = 3;
  repeated TileRandomResult wrecks = 4;
  repeated UnitRandomResult commander_positions = 5;
  repeated UnitRandomResult experience_shares = 6;
}
message SettlementEvent {
  int64 source_unit_id = 1;
  int64 target_unit_id = 2;
  RandomResult random_result = 3;
  repeated SettlementEvent children = 4;
  int32 player_index = 5;
  reserved 114;
  oneof body {
    AttackStartedEvent attack_started = 101;
    AttackCellEvent attack_cell = 102;
    AttackFinishedEvent attack_finished = 103;
    DamageEvent damage = 104;
    DeathStartedEvent death_started = 105;
    DeathCommittedEvent death_committed = 106;
    PlayerDefeatedEvent player_defeated = 107;
    CleanupCompletedEvent cleanup_completed = 108;
    EffectEvent effect = 109;
    SpawnEvent spawn = 110;
    HealEvent heal = 111;
    ResourceEvent resource = 112;
    CommanderPositionEvent commander_position = 113;
    // 114 is retired: experience sharing is an Effect callback with local results.
    ForcedAttackEvent forced_attack = 115;
    PulseEvent pulse = 116;
    WreckEvent wreck = 117;
    ShieldEvent shield = 118;
    EffectMutationEvent effect_mutation = 119;
    ExperienceEvent experience = 120;
    SkillFinishedEvent skill_finished = 121;
    ActionPreparationEvent action_preparation = 122;
    ActionCallbacksEvent action_callbacks = 123;
  }
}
message AttackStartedEvent { string action_name = 1; sint32 target_x = 2; sint32 target_y = 3; bool global_phase = 4 [deprecated = true]; }
message AttackCellEvent { string action_name = 1; sint32 target_x = 2; sint32 target_y = 3; optional sint32 origin_x = 4; optional sint32 origin_y = 5; optional float data = 6; string action_type = 7; int32 skill_index = 8; repeated AttackTargetResult targets = 100; }
message AttackFinishedEvent { string action_name = 1; bool check_after_action = 2; }
message DamageEvent { optional float damage = 1; string action_name = 2; optional sint32 center_x = 3; optional sint32 center_y = 4; bool use_predamage = 5; bool do_random = 6; bool no_kill = 7; }
message DeathStartedEvent { int32 reason = 1; optional float damage = 2; string action_name = 3; bool generate_wreck = 4; optional sint32 center_x = 5; optional sint32 center_y = 6; }
message DeathCommittedEvent { int32 reason = 1; int32 killer_player = 2; bool descend_only = 3; bool callbacks_only = 4; }
message PlayerDefeatedEvent { int32 player_index = 1; }
message CleanupCompletedEvent { int32 player_index = 1; }
message EffectEvent { string effect_name = 1; int32 effect_index = 2; string callback = 3; int64 other_unit_id = 4; optional float damage = 5; bool killed = 6; int32 reason = 7; optional float value = 8; bool preview = 9; string effect_type = 10; sint32 x = 11; sint32 y = 12; }
message SpawnEvent { string template_id = 1; sint32 x = 2; sint32 y = 3; int32 player_index = 4; bool building = 5; bool spawned = 6; int32 create_reason = 7; bool trigger_passives = 8; bool has_position = 9; bool moved = 10; bool actioned = 11; }
message HealEvent { optional float amount = 1; }
message ResourceEvent { int32 player_index = 1; int32 reason = 2; sint32 metal = 3; sint32 power = 4; }
message CommanderPositionEvent { int32 player_index = 1; }
message ForcedAttackEvent { int32 action_category = 1; sint32 target_x = 2; sint32 target_y = 3; }
message PulseEvent { int32 effect_index = 1; }


message WreckEvent { sint32 x = 1; sint32 y = 2; int32 amount = 3; bool use_random = 4; }
message ShieldEvent { int32 damage = 1; bool preview = 2; }
message EffectMutationEvent { string effect_name = 1; int32 layer = 2; int64 caster_unit_id = 3; int32 caster_player = 4; bool remove = 5; int32 effect_index = 6; }
message ExperienceEvent { optional float amount = 1; bool use_filter = 2; bool base_percent = 3; }

message SkillFinishedEvent { int32 player_index = 1; }

message ResolvedMove { sint32 x = 1; sint32 y = 2; }
message ResolvedAction { sint32 move_x = 1; sint32 move_y = 2; sint32 target_x = 3; sint32 target_y = 4; int32 action_category = 5; }
message ResolvedCreate { sint32 move_x = 1; sint32 move_y = 2; sint32 target_x = 3; sint32 target_y = 4; int32 action_category = 5; string template_id = 6; }
message ResolvedUnload { sint32 move_x = 1; sint32 move_y = 2; sint32 target_x = 3; sint32 target_y = 4; int32 action_category = 5; int64 passenger_unit_id = 6; }

message AuthorityTurnPhase { int32 phase = 1; }
message AuthorityMatchEnded { bool local_victory = 1; }

message ActionMovePosition { sint32 x = 1; sint32 y = 2; }

message ActionPreparationEvent { string action_name = 1; sint32 target_x = 2; sint32 target_y = 3; }
message ActionCallbacksEvent { string action_name = 1; }
message AttackTargetResult {
  ActionMovePosition position = 1;
  optional float damage = 2;
  oneof recipient { AttackUnitRecipient unit = 101; AttackShieldRecipient shield = 102; }
}
message AttackUnitRecipient { int64 unit_id = 1; }
message AttackShieldRecipient { int64 caster_unit_id = 1; }
