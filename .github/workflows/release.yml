name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      GAME_REFERENCES_TAG: game-1.0.9

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json

      - name: Validate release tag
        id: version
        shell: pwsh
        run: |
          $source = Get-Content -Raw -LiteralPath '.\src\XingyiStarry.Mp\XingyiStarryMpPlugin.cs'
          $match = [regex]::Match($source, 'PluginVersion\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw 'Could not determine PluginVersion.' }
          $version = $match.Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match PluginVersion $version."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build both release archives from pinned game references
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .\package.ps1 -Configuration Release `
            -GameReferencesTag $env:GAME_REFERENCES_TAG `
            -GitHubToken $env:GITHUB_TOKEN `
            -ArtifactsPath (Join-Path $PWD '.artifacts\release') `
            -OutputDirectory (Join-Path $PWD '.release-installers')

      - name: Wrap installers with licenses
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $inputRoot = Join-Path $PWD '.release-installers'
          $outputRoot = Join-Path $PWD '.release-output'
          New-Item -ItemType Directory -Force -Path $outputRoot | Out-Null

          function New-ReleaseWrapper([string]$suffix, [bool]$includeBepInExLicenses) {
            $name = "XingyiStarry-MP-$version$suffix.zip"
            $installer = Join-Path $inputRoot $name
            if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
              throw "Missing installer archive: $installer"
            }
            $staging = Join-Path $outputRoot ("wrapper-" + [Guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Force -Path $staging | Out-Null
            try {
              Copy-Item -LiteralPath $installer -Destination $staging
              Copy-Item -LiteralPath '.\PACKAGE-README.txt' -Destination (Join-Path $staging 'README.txt')
              Copy-Item -LiteralPath '.\LICENSE' -Destination (Join-Path $staging 'LICENSE.txt')
              Copy-Item -LiteralPath '.\THIRD-PARTY-NOTICES.md' -Destination $staging
              $licenseTarget = Join-Path $staging 'licenses'
              New-Item -ItemType Directory -Force -Path $licenseTarget | Out-Null
              foreach ($license in @('Google.Protobuf-3.25.3-BSD-3-Clause.txt', 'DotNet-Runtime-MIT.txt', 'README.md')) {
                Copy-Item -LiteralPath (Join-Path '.\licenses' $license) -Destination $licenseTarget
              }
              if ($includeBepInExLicenses) {
                foreach ($license in @('BepInEx-5.4.23.5-MIT.txt', 'HarmonyX-2.9.0-MIT.txt', 'Mono.Cecil-0.10.4-MIT.txt', 'MonoMod-22.01.29.01-MIT.txt', 'UnityDoorstop-4.5.0-LGPL-2.1.txt')) {
                  Copy-Item -LiteralPath (Join-Path '.\licenses' $license) -Destination $licenseTarget
                }
              }
              $archive = Join-Path $outputRoot $name
              if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
              Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $archive -CompressionLevel Optimal
            } finally {
              if (Test-Path -LiteralPath $staging) { Remove-Item -LiteralPath $staging -Recurse -Force }
            }
          }

          New-ReleaseWrapper -suffix '' -includeBepInExLicenses $false
          New-ReleaseWrapper -suffix '-with-BepInEx' -includeBepInExLicenses $true

      - name: Run protocol tests
        shell: pwsh
        run: |
          dotnet '.\.artifacts\release\bin\XingyiStarry.Mp.Tests\release\XingyiStarry.Mp.Tests.dll'

      - name: Audit archives and write checksums
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $standard = ".\.release-output\XingyiStarry-MP-$version.zip"
          $bundled = ".\.release-output\XingyiStarry-MP-$version-with-BepInEx.zip"
          $standardInstaller = ".\.release-installers\XingyiStarry-MP-$version.zip"
          $bundledInstaller = ".\.release-installers\XingyiStarry-MP-$version-with-BepInEx.zip"
          foreach ($archive in @($standard, $bundled)) {
            if (-not (Test-Path -LiteralPath $archive)) { throw "Missing archive: $archive" }
          }
          $standardInstallerEntries = tar -tf $standardInstaller
          $bundledInstallerEntries = tar -tf $bundledInstaller
          if ($standardInstallerEntries -match '(^|/)BepInEx/core/') { throw 'Standard installer contains BepInEx core.' }
          if (-not ($bundledInstallerEntries -match 'BepInEx/core/BepInEx.dll')) { throw 'Bundled installer is missing BepInEx.' }
          foreach ($required in @('Uninstall-XingyiStarry-MP.bat', 'Uninstall-XingyiStarry-MP.ps1')) {
            if ($required -notin $standardInstallerEntries -or $required -notin $bundledInstallerEntries) {
              throw "An installer is missing $required."
            }
          }
          $licensePattern = 'LICENSE|THIRD-PARTY|(^|/)licenses/'
          if (($standardInstallerEntries + $bundledInstallerEntries) -match $licensePattern) {
            throw 'A lean installer contains release documentation or licenses.'
          }
          $standardEntries = tar -tf $standard
          $bundledEntries = tar -tf $bundled
          foreach ($required in @(
            "XingyiStarry-MP-$version.zip",
            'README.txt',
            'LICENSE.txt',
            'THIRD-PARTY-NOTICES.md',
            'licenses/Google.Protobuf-3.25.3-BSD-3-Clause.txt'
          )) {
            if ($required -notin $standardEntries) { throw "Standard release wrapper is missing $required." }
          }
          foreach ($required in @(
            "XingyiStarry-MP-$version-with-BepInEx.zip",
            'licenses/BepInEx-5.4.23.5-MIT.txt',
            'licenses/UnityDoorstop-4.5.0-LGPL-2.1.txt'
          )) {
            if ($required -notin $bundledEntries) { throw "Bundled release wrapper is missing $required." }
          }
          $forbidden = 'EarlyPatcher|DebugTools|NoSteam|AnnW\.LanMp'
          if (($standardInstallerEntries + $bundledInstallerEntries + $standardEntries + $bundledEntries) -match $forbidden) { throw 'A release archive contains development-only files.' }
          Get-FileHash -Algorithm SHA256 -LiteralPath $standard, $bundled |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path -Leaf $_.Path)" } |
            Set-Content -LiteralPath '.\.release-output\SHA256SUMS.txt' -Encoding ASCII

      - name: Publish GitHub release
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const version = process.env.RELEASE_VERSION;
            const tag = context.ref.replace('refs/tags/', '');
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `XingyiStarry MP ${version}`,
                generate_release_notes: true,
                draft: false,
                prerelease: false
              })).data;
            }
            const files = [
              `XingyiStarry-MP-${version}.zip`,
              `XingyiStarry-MP-${version}-with-BepInEx.zip`,
              'SHA256SUMS.txt'
            ];
            for (const name of files) {
              const file = path.join(process.cwd(), '.release-output', name);
              const existing = release.assets.find(asset => asset.name === name);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: existing.id
                });
              }
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name,
                data: fs.readFileSync(file),
                headers: {
                  'content-type': name.endsWith('.zip') ? 'application/zip' : 'text/plain',
                  'content-length': fs.statSync(file).size
                }
              });
            }
